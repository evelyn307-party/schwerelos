function currentIndex(t){let lo=0,hi=words.length-1,r=-1;while(lo<=hi){const m=(lo+hi)>>1;if(words[m].start<=t){r=m;lo=m+1}else hi=m-1}return r;}
function update(force=false){const i=currentIndex(audio.currentTime);if(!force&&i===current)return;current=i;document.querySelectorAll('.lyric-word').forEach(s=>{const n=+s.dataset.index;s.classList.toggle('active',n===i);s.classList.toggle('spoken',n<i)});const w=words[i];if(!w)return;const ln=w.line;document.querySelectorAll('.lyric-line').forEach(l=>{const n=+l.dataset.line;l.classList.toggle('visible',Math.abs(n-ln)<=1);l.classList.toggle('active-line',n===ln)});if(ln!==currentLine){currentLine=ln;const l=lineEls.get(ln);if(l)l.scrollIntoView({behavior:'smooth',block:'center'});}}
audio.addEventListener('timeupdate',()=>update());audio.addEventListener('seeked',()=>update(true));
playBtn.addEventListener('click',async()=>{if(audio.paused){try{await audio.play();playIcon.style.display='none';pauseIcon.style.display='block';playBtn.setAttribute('aria-label','Audio pausieren')}catch(e){console.error(e)}}else{audio.pause();playIcon.style.display='block';pauseIcon.style.display='none';playBtn.setAttribute('aria-label','Audio abspielen')}});
audio.addEventListener('ended',()=>{playIcon.style.display='block';pauseIcon.style.display='none';playBtn.setAttribute('aria-label','Audio abspielen');current=-1;currentLine=-1;update(true)});audio.addEventListener('error',()=>console.error('Die Audiodatei konnte nicht geladen werden.'));update(true);
</script></body></html>
