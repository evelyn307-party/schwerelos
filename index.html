<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Major Rolf – 70 Jahre schwerelos</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Hintergrundbild -->
  <img
    src="background.jpg"
    class="background"
    alt=""
    aria-hidden="true"
  >

  <!-- Karaoke-Songtext -->
  <div
    id="lyrics"
    class="lyrics"
    aria-live="polite"
    aria-label="Songtext"
  ></div>

  <!-- Audio-Element -->
  <audio
    id="myAudio"
    src="audio.mp3"
    preload="auto"
  ></audio>

  <!-- Play / Pause Button -->
  <button
    id="playBtn"
    class="play-button"
    type="button"
    aria-label="Audio abspielen"
  >
    <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
      <polygon points="5,3 19,12 5,21" fill="currentColor" />
    </svg>

    <svg id="pauseIcon" viewBox="0 0 24 24" aria-hidden="true" style="display: none;">
      <rect x="5" y="4" width="4" height="16" fill="currentColor" />
      <rect x="15" y="4" width="4" height="16" fill="currentColor" />
    </svg>
  </button>

  <script>
    const audio = document.getElementById('myAudio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const lyricsContainer = document.getElementById('lyrics');

    /*
     * Synchronisierte Songzeilen.
     *
     * Die Zeitpunkte sind aus der vorliegenden MP3 abgeleitet
     * und zunächst als sehr gute Startwerte gesetzt. Für eine
     * wortgenaue Karaoke-Synchronisation können sie später noch
     * feinjustiert werden.
     */
    const lyrics = [
      { time: 12.50, text: 'Gründlich durchgecheckt steht er heut da,' },
      { time: 17.42, text: 'siebzig Jahre – wunderbar!' },
      { time: 20.65, text: 'Die Familie wartet alle sind bereit' },
      { time: 24.54, text: 'denn heute feiern wir deine Zeit!' },
      { time: 28.42, text: 'Die Gläser hoch, wir stoßen an,' },
      { time: 32.30, text: 'weil man mit siebzig richtig feiern kann.' },
      { time: 37.09, text: 'Jeder weiß genau, was heute zählt:' },
      { time: 41.36, text: 'Dass Major Rolf uns alle liebt!' },
      { time: 44.99, text: 'Und Major Rolf macht einen Scherz,' },
      { time: 49.00, text: 'dann hebt er ab und…' },
      { time: 51.80, text: 'Völlig losgelöst von der Erde' },
      { time: 54.04, text: 'schwebt Major Rolf fast schwerelos.' },
      { time: 56.99, text: '70 Jahre mit Glück verbunden,' },
      { time: 59.41, text: 'und die Party läuft schon seit Stunden.' },
      { time: 62.55, text: 'Die Chemie stimmt ganz genau,' },
      { time: 64.96, text: 'denn Rolf, wir wissen auch:' },
      { time: 67.38, text: 'Mit dir wird jeder Abend groß!' },
      { time: 70.20, text: 'Im Labor da war er in seinem Element,' },
      { time: 75.11, text: 'wo er jede Formel und Reaktion kennt.' },
      { time: 80.18, text: 'Chemiker mit Herz und Verstand,' },
      { time: 84.63, text: 'mit sicherer Hand und stets gespannt.' },
      { time: 89.85, text: 'Öle aller Konsistenz –' },
      { time: 92.76, text: 'Rolf verbindet sie mit Exzellenz' },
      { time: 97.06, text: 'und liefert Schmierstoff-Kompetenz!' },
      { time: 102.43, text: 'Und Major Rolf macht einen Scherz,' },
      { time: 107.19, text: 'dann hebt er ab und…' },
      { time: 110.80, text: 'Völlig losgelöst von der Erde' },
      { time: 112.86, text: 'schwebt Major Rolf fast schwerelos.' },
      { time: 115.59, text: 'Siebzig Jahre mit Glück verbunden' },
      { time: 117.98, text: 'und die Party läuft schon seit Stunden.' },
      { time: 120.87, text: 'Siebzig Jahre – welch ein Leben,' },
      { time: 123.27, text: 'und noch ganz viel Gas zu geben!' },
      { time: 125.58, text: 'Major Rolf, mit dir wird jeder Abend groß!' },
      { time: 129.20, text: 'Siebzig Jahre dauert nun schon deine Reise,' },
      { time: 133.82, text: 'mal laut und lustig, mal ganz leise.' },
      { time: 137.84, text: 'Doch eines bleibt uns sonnenklar:' },
      { time: 141.51, text: 'Major Rolf ist immer für uns da!' },
      { time: 144.83, text: 'Er hat keine Zeit, sich auszuruhn,' },
      { time: 148.74, text: 'denn es gibt noch so viel zu tun.' },
      { time: 152.05, text: 'Kinder und Enkel, alle sind da' },
      { time: 155.25, text: 'und sagen gemeinsam: „Rolf, du bist wunderbar!“' },
      { time: 160.82, text: 'Und Major Rolf macht einen Scherz,' },
      { time: 164.49, text: 'dann hebt er ab und…' },
      { time: 167.50, text: 'Völlig losgelöst von der Erde' },
      { time: 169.68, text: 'schwebt Major Rolf fast schwerelos.' },
      { time: 172.56, text: 'Siebzig Jahre mit Glück verbunden' },
      { time: 175.08, text: 'und die Party läuft schon seit Stunden.' },
      { time: 178.13, text: 'Siebzig Jahre – welch ein Leben,' },
      { time: 180.66, text: 'und noch ganz viel Gas zu geben!' },
      { time: 183.10, text: 'Major Rolf, mit dir wird jeder Abend groß!' },
      { time: 187.00, text: 'Wenn der Abend beginnt,' },
      { time: 189.63, text: 'man auf der Wiese zusammenfindet,' },
      { time: 193.34, text: 'dann knistert das Feuer, der Himmel wird weit,' },
      { time: 198.48, text: 'und Rolf genießt diese gemütliche Zeit.' },
      { time: 202.79, text: 'Eine Luftmatratze, ein guter Wein,' },
      { time: 206.85, text: 'Familie dabei, so soll es sein.' },
      { time: 210.44, text: 'Die Sterne funkeln, die Nacht wird still,' },
      { time: 215.10, text: 'weil Rolf genau hier sein will.' },
      { time: 218.45, text: 'Und Major Rolf macht einen Scherz,' },
      { time: 222.16, text: 'dann hebt er ab und…' },
      { time: 224.19, text: 'Völlig losgelöst von der Erde' },
      { time: 227.18, text: 'stoßen wir heute gemeinsam an!' },
      { time: 230.53, text: 'Auf Gesundheit, Glück und frohe Stunden' },
      { time: 234.84, text: '– und Major Rolf fliegt weiter seine Runden!' },
    ];

    let currentLyricIndex = -1;

    // Songtext erzeugen
    lyrics.forEach((line, index) => {
      const element = document.createElement('div');
      element.className = 'lyric-line';
      element.dataset.index = index;
      element.textContent = line.text;
      lyricsContainer.appendChild(element);
    });

    const lyricElements = [...document.querySelectorAll('.lyric-line')];

    function updateLyrics() {
      const time = audio.currentTime;

      let newIndex = -1;

      for (let i = 0; i < lyrics.length; i++) {
        if (time >= lyrics[i].time) {
          newIndex = i;
        } else {
          break;
        }
      }

      if (newIndex === currentLyricIndex) return;

      currentLyricIndex = newIndex;

      lyricElements.forEach((element, index) => {
        element.classList.toggle('active', index === currentLyricIndex);
        element.classList.toggle('past', index < currentLyricIndex);
        element.classList.toggle('next', index > currentLyricIndex);
      });

      if (currentLyricIndex >= 0 && lyricElements[currentLyricIndex]) {
        lyricElements[currentLyricIndex].scrollIntoView({
          behavior: 'smooth',
          block: 'center'
        });
      }
    }

    audio.addEventListener('timeupdate', updateLyrics);
    audio.addEventListener('seeked', updateLyrics);

    // Audio starten / pausieren
    playBtn.addEventListener('click', async () => {
      if (audio.paused) {
        try {
          await audio.play();

          playIcon.style.display = 'none';
          pauseIcon.style.display = 'block';
          playBtn.setAttribute('aria-label', 'Audio pausieren');

        } catch (error) {
          console.error('Audio konnte nicht abgespielt werden:', error);
        }
      } else {
        audio.pause();

        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
        playBtn.setAttribute('aria-label', 'Audio abspielen');
      }
    });

    // Wenn das Audio zu Ende ist
    audio.addEventListener('ended', () => {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
      playBtn.setAttribute('aria-label', 'Audio abspielen');

      currentLyricIndex = -1;

      lyricElements.forEach(element => {
        element.classList.remove('active', 'past');
        element.classList.add('next');
      });

      if (lyricElements[0]) {
        lyricElements[0].scrollIntoView({
          behavior: 'smooth',
          block: 'center'
        });
      }
    });

    audio.addEventListener('error', () => {
      console.error('Die Audiodatei konnte nicht geladen werden.');
    });
  </script>

</body>
</html>
